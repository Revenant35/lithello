version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @lithello/shared build && pnpm --filter web build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - $(pnpm store path)
    appRoot: packages/web
