version: 1
applications:
  - appRoot: packages/web
    frontend:
      phases:
        preBuild:
          commands:
            - corepack enable
            - corepack prepare --activate
            - cd ../.. && pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm --filter @lithello/shared build
            - pnpm --filter web build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
